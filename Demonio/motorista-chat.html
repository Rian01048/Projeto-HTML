<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — CarretoUber Motorista</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <a href="motorista-corrida.html" class="back">&larr; Voltar</a>
    <div class="brand" style="font-size:1.05rem;" id="nomeChat">Chat</div>
    <div style="width:50px;"></div>
  </div>

  <div class="screen no-pad-bottom" style="display:flex; flex-direction:column; min-height:calc(100vh - 65px);">
    <span class="eyebrow">RF-09 &middot; Chat e contato &middot; <span style="color:var(--concreto);">respostas simuladas por IA local</span></span>

    <div class="chat-window" id="chatWindow" style="flex:1; margin-top:12px;"></div>
    <div id="digitando" class="small-print" style="display:none; margin-bottom:6px;">digitando...</div>

    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Escreva uma mensagem...">
      <button class="chat-send" id="chatSend">➤</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="motorista-home.html"><span class="icon">🏠</span>Início</a>
    <a href="motorista-corrida.html"><span class="icon">🚚</span>Corrida</a>
    <a href="motorista-perfil.html"><span class="icon">👤</span>Perfil</a>
  </nav>
</div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/chat-ai.js"></script>
<script>
  const usuario = AUTH.exigirSessao('motorista');
  const params = new URLSearchParams(window.location.search);
  let solicitacaoId = params.get('solicitacaoId');

  if (!solicitacaoId) {
    const ativa = DB.getSolicitacaoAtivaDoMotorista(usuario.id);
    if (ativa) solicitacaoId = ativa.id;
  }

  const solicitacao = solicitacaoId ? DB.getSolicitacaoPorId(solicitacaoId) : null;
  const cliente = solicitacao ? DB.getUsuarioPorId(solicitacao.clienteId) : null;

  const chatWindow = document.getElementById('chatWindow');
  const chatInput = document.getElementById('chatInput');
  const digitando = document.getElementById('digitando');

  document.getElementById('nomeChat').textContent = cliente ? cliente.nome : 'Chat';

  function horaFmt(ts) {
    const d = new Date(ts);
    return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
  }

  function renderMensagens() {
    if (!solicitacaoId) {
      chatWindow.innerHTML = '<p class="small-print">Nenhuma conversa disponível. Aceite um orçamento para conversar com o cliente.</p>';
      return;
    }
    const mensagens = DB.getMensagens(solicitacaoId);
    chatWindow.innerHTML = mensagens.map(m => {
      const minha = m.autorId === usuario.id;
      return `<div style="align-self:${minha ? 'flex-end' : 'flex-start'};">
        <div class="msg ${minha ? 'msg-out' : 'msg-in'}">${m.texto.replace(/</g, '&lt;')}</div>
        <div class="msg-time" style="text-align:${minha ? 'right' : 'left'};">${horaFmt(m.criadoEm)}</div>
      </div>`;
    }).join('');
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function enviar() {
    const texto = chatInput.value.trim();
    if (!texto || !solicitacaoId) return;
    DB.enviarMensagem(solicitacaoId, usuario.id, texto);
    chatInput.value = '';
    renderMensagens();

    if (cliente) {
      digitando.style.display = 'block';
      setTimeout(() => {
        const resposta = CHAT_AI.gerarResposta(texto);
        DB.enviarMensagem(solicitacaoId, cliente.id, resposta);
        digitando.style.display = 'none';
        renderMensagens();
      }, 900 + Math.random() * 700);
    }
  }

  document.getElementById('chatSend').addEventListener('click', enviar);
  chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') enviar(); });

  renderMensagens();
</script>
</body>
</html>
