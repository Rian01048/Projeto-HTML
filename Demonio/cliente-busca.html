<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscando transportadores — CarretoUber</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <a href="cliente-home.html" class="back">&larr; Voltar</a>
    <div class="brand page-title">Buscando transportadores</div>
    <div class="topbar-spacer"></div>
  </div>

  <main class="screen">
    <span class="eyebrow">RF-05/13 · Compatibilidade</span>
    <p id="resumoBusca">Procurando transportadores compatíveis com sua carga na região.</p>

    <div id="resumoSolicitacao" class="card compact-summary"></div>

    <div class="map-box" aria-label="Representação visual dos transportadores próximos">
      <span class="pin pin-you">📍</span>
      <span class="pin pin-driver1">🚚</span>
      <span class="pin pin-driver2">🚚</span>
      <span class="pin pin-driver3">🚐</span>
      <span class="label">Rastreando em tempo real</span>
    </div>

    <div class="stack" id="listaMotoristas"></div>
    <p class="small-print center search-hint">Toque em um transportador para ver o perfil completo.</p>
  </main>
</div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/cliente-busca.js"></script>
</body>
</html>
